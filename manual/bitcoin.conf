# /var/lib/knots/bitcoin.conf - Bitcoin Knots (BLAKE2b fork), pruned, for a DATUM gateway
server=1
disablewallet=1
prune=2000
txindex=0
dbcache=2000            # speeds up the first sync; lower to 400 afterwards if RAM is tight
maxmempool=200
# RPC - local only; the gateway logs in with these
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcuser=knots
rpcpassword=CHANGE-ME-to-a-long-random-string
# Peers: the fork has no DNS seeds of its own, so start from the pool's public nodes and let gossip do the rest
dnsseed=0
fixedseeds=0
addnode=stratum.xorpool.com:18901
addnode=datum.xorpool.com:8333
# Tell the gateway the instant a new block arrives (keeps your miners off stale work)
blocknotify=/usr/bin/pkill -USR1 ratum-gateway
