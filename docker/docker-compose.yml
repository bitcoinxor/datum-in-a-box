name: datum-in-a-box
# Your own node + gateway = your own block templates on the Bitcoin BLAKE2b chain.
# Edit ONE line (your address) in .env, then run ./setup.sh (Linux/VPS) or setup-windows.ps1 (WSL).

services:
  node:                                       # the fork full node, pruned
    image: bitcoinxor/knotsd:latest
    build: ./node                             # see node/Dockerfile (you must supply the fork binary)
    volumes:
      - node-data:/data
    command: >
      -datadir=/data
      -prune=${PRUNE_MB}
      -server=1 -listen=1 -txindex=0
      -rpcbind=0.0.0.0:8332 -rpcallowip=172.16.0.0/12
      -rpcuser=${RPC_USER} -rpcpassword=${RPC_PASS}
    restart: unless-stopped
    stop_grace_period: 2m

  gateway:                                    # ratum-gateway (BYO mode) -> your prime
    image: bitcoinxor/ratum-gateway:latest
    build: ./gateway
    depends_on:
      - node
    ports:
      - "${STRATUM_PORT}:23334"               # your ASICs connect here
      - "8000:8000"                           # local status page: http://<this-ip>:8000
    environment:
      NODE_RPC_URL:  http://node:8332
      RPC_USER:      ${RPC_USER}
      RPC_PASS:      ${RPC_PASS}
      POOL_HOST:     ${POOL_HOST}
      POOL_PORT:     ${POOL_PORT}
      POOL_PUBKEY:   ${POOL_PUBKEY}
      MINER_ADDRESS: ${MINER_ADDRESS}
      COINBASE_TAG_SECONDARY: ${COINBASE_TAG_SECONDARY}
    restart: unless-stopped

volumes:
  node-data: {}
